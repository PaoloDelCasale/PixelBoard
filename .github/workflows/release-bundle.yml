name: Build release bundle (commit .mpp)

# Manual workflow: runs the tests, compiles the patch bundle from source and commits
# patches/PixelBoard.mpp and patches/patches-<version>.mpp to the branch it was started on.

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  bundle:
    name: Build & commit patch bundle
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run Unit Tests & Build Android Patch Bundle (.mpp)
        run: |
          chmod +x pixelboard-patches/gradlew
          cd pixelboard-patches
          ./gradlew test :patches:buildAndroid

      - name: Commit compiled bundle
        run: |
          VERSION=$(grep -E "^version\s*=" pixelboard-patches/gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MPP="pixelboard-patches/patches/build/libs/patches-${VERSION}.mpp"
          ls -la pixelboard-patches/patches/build/libs
          test -f "$MPP"
          git rm -q --ignore-unmatch patches/patches-*.mpp
          cp "$MPP" patches/PixelBoard.mpp
          cp "$MPP" "patches/patches-${VERSION}.mpp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/PixelBoard.mpp "patches/patches-${VERSION}.mpp"
          git commit -m "build: compile patch bundle ${VERSION} from source (CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
