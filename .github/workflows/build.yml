name: Build & Test PixelBoard Patches

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x pixelboard-patches/gradlew

      - name: Run Unit Tests & Wiring Verification
        run: |
          cd pixelboard-patches
          ./gradlew test --info

      - name: Build Android Patch Bundle (.mpp)
        run: |
          cd pixelboard-patches
          ./gradlew :patches:buildAndroid

      - name: Upload Compiled Patch Bundle
        uses: actions/upload-artifact@v4
        with:
          name: pixelboard-patches-bundle
          path: pixelboard-patches/patches/build/libs/*.mpp

      - name: Commit compiled bundle (manual runs on non-main branches only)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          VERSION=$(grep -E "^version\s*=" pixelboard-patches/gradle.properties | cut -d'=' -f2 | tr -d ' ')
          MPP="pixelboard-patches/patches/build/libs/patches-${VERSION}.mpp"
          ls -la pixelboard-patches/patches/build/libs
          test -f "$MPP"
          git rm -q --ignore-unmatch patches/patches-*.mpp
          cp "$MPP" patches/PixelBoard.mpp
          cp "$MPP" "patches/patches-${VERSION}.mpp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/PixelBoard.mpp "patches/patches-${VERSION}.mpp"
          git commit -m "build: compile patch bundle ${VERSION} from source (CI)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
